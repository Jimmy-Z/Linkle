<!DOCTYPE html>
<html>
	<head>
		<script type="module" src="options.js"></script>
		<style type="text/css">
			html, body {
				margin: 0;
				padding: 0;
			}
			body {
				font-family: Cascadia Mono, Consolas, monospace;
				font-size: 14px;
			}
			.editor {
				display: flex;
				flex-direction: column;
				height: 100dvh;
				width: 100dvw;
				box-sizing: border-box;
				padding: .5rem;
				margin: 0;
				overflow: hidden;
			}
			textarea {
				flex: 1;
				resize: none;
				box-sizing: border-box;
				margin: 0;
				padding: 2px;
				font-family: inherit;
				font-size: inherit;
			}
			.buttons {
				display: flex;
			}
			#id_show_example, #id_hide_example {
				margin-left: auto;
			}
			button {
				font-family: Candara, Sans Serif;
				font-size: inherit;
				margin: 0;
				width: 72px;
			}
			.popup{
				position: absolute;
				border: 1px solid black;
				background-color: white;
				top: 38%; left: 38%;
				padding: 12px 20px;
				z-index: 2;
			}
			[hidden] {
				display: none;
			}
		</style>
	</head>
	<body>
		<div class="editor">
		<textarea id="id_conf"></textarea>
		<textarea id="id_example" hidden></textarea>
		<div class="buttons">
		<button id="id_save">save</button>
		<button id="id_export">export</button>
		<button id="id_import">import</button>
		<button id="id_request">request</button>
		<button id="id_revoke">revoke</button>
		<button id="id_show_example">help</button>
		<button id="id_hide_example" hidden>back</button>
		</div>
		</div>
	</body>
</html>
